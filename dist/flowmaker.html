<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Turn mermaid flowcharts into beautiful, animated, self-contained HTML flow diagrams.">
<title>FlowMaker</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#111}
  #app,#app .fm-root{height:100dvh;display:flex;flex-direction:column;background:var(--ground,#fff);color:var(--ink,#111)}
  .fm-topbar{display:flex;align-items:baseline;gap:1rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--border,#ddd);flex-wrap:wrap;flex:0 0 auto}
  .fm-brand{font-weight:800;letter-spacing:-.02em}
  .fm-doc-title{font-weight:600}
  .fm-doc-subtitle{color:var(--ink-dim,#666);font-size:.9rem}
  .fm-topbar-actions{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .fm-body{flex:1 1 auto;display:grid;grid-template-columns:250px 1fr;min-height:0}
  .fm-rail{overflow:auto;padding:1rem;border-right:1px solid var(--border,#ddd);display:flex;flex-direction:column;gap:.35rem}
  .fm-rail h2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim,#666);margin:.9rem 0 .2rem}
  .fm-rail label{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.85rem;margin:.15rem 0}
  .fm-rail select{font:inherit;font-size:.82rem;padding:.2em .4em;border-radius:6px;border:1px solid var(--border,#ddd);background:var(--surface,#fff);color:inherit}
  .fm-main{min-width:0;display:grid;grid-template-rows:1.9fr 1fr;min-height:0}
  .fm-panel{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border,#ddd)}
  .fm-panel-tabs{display:flex;gap:.4rem;align-items:center;padding:.45rem .7rem;border-bottom:1px solid var(--border,#ddd);flex-wrap:wrap;flex:0 0 auto}
  .fm-zoom{margin-left:auto;display:flex;gap:.3rem;align-items:center;font-size:.82rem}
  .fm-flip{position:relative;flex:1 1 auto;min-height:0;perspective:1800px}
  .fm-face{position:absolute;inset:0;backface-visibility:hidden;transition:transform .55s cubic-bezier(.2,.8,.2,1);overflow:hidden;display:flex}
  .fm-face-front{transform:rotateX(0)}
  .fm-face-back{transform:rotateX(180deg)}
  .fm-flip[data-face="back"] .fm-face-front{transform:rotateX(-180deg)}
  .fm-flip[data-face="back"] .fm-face-back{transform:rotateX(0)}
  .fm-canvas{flex:1 1 auto}
  .fm-code,#fm-editor{flex:1 1 auto;width:100%;margin:0;overflow:auto;padding:1rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;border:0;resize:none;background:var(--surface,#fff);color:var(--ink,#111);white-space:pre-wrap;word-break:break-word}
  #fm-editor:focus-visible{outline:2px solid var(--c1,#26f);outline-offset:-2px}
  .fm-palette-chip{display:flex;align-items:center;gap:3px;width:100%;padding:.35rem;border-radius:8px;cursor:pointer;background:none;border:1px solid transparent;color:inherit}
  .fm-palette-chip[aria-pressed="true"]{border-color:var(--c1,#26f);background:var(--surface-2,#f2f2f2)}
  .fm-palette-chip span{width:16px;height:16px;border-radius:4px}
  .fm-palette-chip em{margin-left:.4rem;font-style:normal;font-size:.8rem}
  .fm-swatch-card{display:block;width:100%;text-align:left;padding:.5rem .6rem;border-radius:8px;cursor:pointer;background:none;border:1px solid var(--border,#ddd);margin-bottom:.3rem;color:inherit;font:inherit;font-size:.85rem}
  .fm-swatch-card[aria-pressed="true"]{border-color:var(--c1,#26f);background:var(--surface-2,#f2f2f2);font-weight:700}
  .fm-seg{display:flex;gap:.25rem}
  .fm-seg button,.fm-zoom button,.fm-panel-tabs button,.fm-topbar-actions button,.fm-file,#fm-samples{font:inherit;font-size:.82rem;padding:.32em .7em;border-radius:999px;border:1px solid var(--border,#ddd);background:var(--surface-2,#f6f6f6);color:inherit;cursor:pointer}
  .fm-seg button[aria-pressed="true"],.fm-panel-tabs button[aria-pressed="true"]{background:var(--c1,#26f);color:var(--c1-ink,#fff);border-color:var(--c1,#26f)}
  .fm-seg button:focus-visible,.fm-zoom button:focus-visible,.fm-panel-tabs button:focus-visible,.fm-topbar-actions button:focus-visible,.fm-swatch-card:focus-visible,.fm-palette-chip:focus-visible{outline:2px solid var(--c2,#73f);outline-offset:2px}
  .fm-primary{background:var(--c1,#26f)!important;color:var(--c1-ink,#fff)!important;border-color:var(--c1,#26f)!important;font-weight:700}
  .fm-warnings{margin:0;padding:.5rem 1rem;list-style:none;border-top:1px solid var(--border,#ddd);background:var(--c4-soft,#fee);font-size:.8rem;max-height:22vh;overflow:auto;flex:0 0 auto}
  .fm-warnings li{margin:.15rem 0}
  .fm-warnings code{font-weight:700;margin-right:.5em;opacity:.75}
  [data-dropping="true"]{outline:3px dashed var(--c1,#26f);outline-offset:-8px}
  /* Present mode: strip every piece of interface except the flow itself. */
  #app[data-present="true"] .fm-topbar,
  #app[data-present="true"] .fm-rail,
  #app[data-present="true"] .fm-panel-editor,
  #app[data-present="true"] .fm-panel-tabs,
  #app[data-present="true"] .fm-warnings{display:none}
  #app[data-present="true"] .fm-body{grid-template-columns:1fr;grid-template-rows:1fr}
  #app[data-present="true"] .fm-main{grid-template-rows:1fr}
  #app[data-present="true"] .fm-panel{border-top:0}
  .fm-present-bar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:1rem;padding:.7rem 1.1rem;opacity:0;transition:opacity .25s ease;pointer-events:none}
  .fm-present-bar:hover,.fm-present-bar:focus-within,#app[data-present="true"]:hover .fm-present-bar{opacity:1;pointer-events:auto}
  .fm-present-title{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;color:var(--ink,#111);text-shadow:0 1px 12px var(--ground,#fff)}
  .fm-present-actions{margin-left:auto;display:flex;gap:.4rem;align-items:center}
  .fm-present-actions button{font:inherit;font-size:.8rem;padding:.3em .75em;border-radius:999px;border:1px solid var(--border,#ddd);background:var(--surface-2,#f6f6f6);color:var(--ink,#111);cursor:pointer}
  .fm-present-actions button[aria-pressed="true"]{background:var(--c1,#26f);color:var(--c1-ink,#fff);border-color:var(--c1,#26f)}
  .fm-present-exit{width:2.1rem;height:2.1rem;font-size:1.15rem;line-height:1;display:grid;place-items:center}
  .fm-present-actions button:focus-visible{outline:2px solid var(--c2,#73f);outline-offset:2px}
  @media (max-width:900px){
    .fm-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .fm-rail{border-right:0;border-bottom:1px solid var(--border,#ddd);max-height:38vh}
    .fm-main{grid-template-rows:1.6fr 1fr}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>(function(){
/* src/constants.js */
const STYLE_KEYS = [
  'neon-circuit', 'executive-clean', 'blueprint', 'soft-depth', 'bold-brutal', 'infographic',
];
const DENSITY_KEYS = ['marquee', 'standard', 'compact'];
const DIRECTION_KEYS = ['LR', 'RL', 'TD', 'BT'];
const DEFAULTS = {
  style: 'executive-clean',
  palette: 'harbor',
  direction: 'LR',
  density: 'standard',
};

// Hard cap on node width. Beyond this a label wraps instead of stretching.
const MAX_LABEL_W = 460;
const DENSITY = {
  marquee:  { fontSize: 30, labelFontSize: 22, padX: 40, padY: 28, rankGap: 190, laneGap: 76, stroke: 5, minNodeW: 260, nodeH: 104, corner: 18 },
  standard: { fontSize: 18, labelFontSize: 13, padX: 24, padY: 16, rankGap: 120, laneGap: 46, stroke: 2.5, minNodeW: 170, nodeH: 66, corner: 12 },
  compact:  { fontSize: 13, labelFontSize: 10, padX: 14, padY: 10, rankGap: 82, laneGap: 30, stroke: 1.5, minNodeW: 120, nodeH: 46, corner: 8 },
};

/* src/palettes.js */
// The four-swatch contract:
//   c1 Flow | c2 Decision | c3 Accent | c4 Alert
const PALETTES = [
  { key: 'harbor', name: 'Harbor', c1: '#2563eb', c2: '#7c3aed', c3: '#0d9488', c4: '#dc2626' },
  { key: 'ember', name: 'Ember', c1: '#ea580c', c2: '#ca8a04', c3: '#0d9488', c4: '#be123c' },
  { key: 'forest', name: 'Forest', c1: '#15803d', c2: '#a16207', c3: '#0891b2', c4: '#b91c1c' },
  { key: 'midnight', name: 'Midnight', c1: '#4f46e5', c2: '#9333ea', c3: '#0891b2', c4: '#e11d48' },
  { key: 'slate', name: 'Slate', c1: '#475569', c2: '#0f766e', c3: '#2563eb', c4: '#c2410c' },
  { key: 'candy', name: 'Candy', c1: '#db2777', c2: '#7c3aed', c3: '#0891b2', c4: '#d97706' },
  { key: 'mono', name: 'Monochrome', c1: '#374151', c2: '#6b7280', c3: '#111827', c4: '#9ca3af' },
  { key: 'signal', name: 'Signal', c1: '#0369a1', c2: '#a16207', c3: '#15803d', c4: '#dc2626' },
];
function getPalette(key) {
  return PALETTES.find((p) => p.key === key) ?? PALETTES[0];
}

const clamp01 = (n) => Math.min(1, Math.max(0, n));

function hexToRgb(hex) {
  const h = String(hex).replace('#', '');
  return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
}

function rgbToHex([r, g, b]) {
  return `#${[r, g, b].map((v) => Math.round(clamp01(v) * 255).toString(16).padStart(2, '0')).join('')}`;
}

const srgbToLinear = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
const linearToSrgb = (v) => (v <= 0.0031308 ? v * 12.92 : 1.055 * v ** (1 / 2.4) - 0.055);

// sRGB <-> Oklab, per Bjorn Ottosson's reference conversion.
function hexToOklch(hex) {
  const [r, g, b] = hexToRgb(hex).map(srgbToLinear);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
  const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
  const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
  return { l: L, c: Math.hypot(A, B), h: (Math.atan2(B, A) * 180) / Math.PI };
}
function oklchToHex({ l, c, h }) {
  const rad = (h * Math.PI) / 180;
  const A = c * Math.cos(rad);
  const B = c * Math.sin(rad);
  const l_ = (l + 0.3963377774 * A + 0.2158037573 * B) ** 3;
  const m_ = (l - 0.1055613458 * A - 0.0638541728 * B) ** 3;
  const s_ = (l - 0.0894841775 * A - 1.291485548 * B) ** 3;
  const rgb = [
    4.0767416621 * l_ - 3.3077115913 * m_ + 0.2309699292 * s_,
    -1.2684380046 * l_ + 2.6097574011 * m_ - 0.3413193965 * s_,
    -0.0041960863 * l_ - 0.7034186147 * m_ + 1.707614701 * s_,
  ].map((v) => linearToSrgb(clamp01(v)));
  return rgbToHex(rgb);
}

function relativeLuminance(hex) {
  const [r, g, b] = hexToRgb(hex).map(srgbToLinear);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrastRatio(a, b) {
  const la = relativeLuminance(a);
  const lb = relativeLuminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

// Picks whichever of near-white or near-black has the higher contrast on the
// given swatch. Every palette swatch is chosen so the winner clears 4.5:1.
function inkFor(hex) {
  const light = '#ffffff';
  const dark = '#0b0f14';
  return contrastRatio(light, hex) >= contrastRatio(dark, hex) ? light : dark;
}

// Shifts a swatch toward the ground so it can serve as a fill behind ink.
function soften(hex, dark) {
  const { l, c, h } = hexToOklch(hex);
  return oklchToHex(dark
    ? { l: Math.max(0.18, l * 0.34), c: c * 0.55, h }
    : { l: Math.min(0.97, 0.93 + l * 0.05), c: Math.min(c * 0.34, 0.06), h });
}
function deriveTokens(palette, { dark = false } = {}) {
  const p = palette;
  const anchor = hexToOklch(p.c1);

  // Surfaces borrow the primary hue at very low chroma so the whole diagram
  // reads as one temperature rather than colored shapes on neutral grey.
  const surface = dark
    ? oklchToHex({ l: 0.19, c: Math.min(anchor.c * 0.12, 0.02), h: anchor.h })
    : oklchToHex({ l: 0.99, c: Math.min(anchor.c * 0.06, 0.006), h: anchor.h });
  const surface2 = dark
    ? oklchToHex({ l: 0.26, c: Math.min(anchor.c * 0.14, 0.025), h: anchor.h })
    : oklchToHex({ l: 0.965, c: Math.min(anchor.c * 0.09, 0.012), h: anchor.h });
  const ground = dark
    ? oklchToHex({ l: 0.13, c: Math.min(anchor.c * 0.1, 0.02), h: anchor.h })
    : oklchToHex({ l: 0.975, c: Math.min(anchor.c * 0.05, 0.008), h: anchor.h });

  // Ink is pushed until it clears 7:1 against the surface (the marquee floor).
  let ink = dark ? '#f5f8fc' : '#0a0e14';
  for (let i = 0; i < 24 && contrastRatio(ink, surface) < 7.2; i += 1) {
    const t = hexToOklch(ink);
    ink = oklchToHex({ l: clamp01(dark ? t.l + 0.02 : t.l - 0.02), c: t.c, h: t.h });
  }
  const inkTone = hexToOklch(ink);
  const inkDim = oklchToHex({ l: clamp01(dark ? inkTone.l - 0.22 : inkTone.l + 0.3), c: inkTone.c, h: inkTone.h });
  const border = dark
    ? oklchToHex({ l: 0.38, c: Math.min(anchor.c * 0.2, 0.03), h: anchor.h })
    : oklchToHex({ l: 0.87, c: Math.min(anchor.c * 0.15, 0.02), h: anchor.h });

  const tokens = {
    '--surface': surface,
    '--surface-2': surface2,
    '--ground': ground,
    '--ink': ink,
    '--ink-dim': inkDim,
    '--border': border,
  };
  for (const k of ['c1', 'c2', 'c3', 'c4']) {
    tokens[`--${k}`] = p[k];
    tokens[`--${k}-soft`] = soften(p[k], dark);
    tokens[`--${k}-ink`] = inkFor(p[k]);
  }
  return tokens;
}

/* src/styles/neon-circuit.js */
const __default_src_styles_neon_circuit_js = {
  key: 'neon-circuit',
  name: 'Neon Circuit',
  dark: true,
  css: (t, spec) => `
.fm-root {
  ${Object.entries(t).map(([k, v]) => `${k}: ${v};`).join('\n  ')}
  --font: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stroke: ${spec.stroke}px;
  --corner: ${spec.corner}px;
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, color-mix(in oklab, var(--c1) 14%, transparent), transparent 70%),
    var(--ground);
  font-family: var(--font);
  color: var(--ink);
}
.fm-svg { display: block; }
.fm-subgraph rect { fill: color-mix(in oklab, var(--c1) 6%, transparent); stroke: color-mix(in oklab, var(--c1) 45%, transparent); stroke-width: var(--stroke); rx: calc(var(--corner) + 8px); }
.fm-subgraph text { fill: var(--c1); font-size: ${spec.labelFontSize + 3}px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.fm-node-shape {
  fill: color-mix(in oklab, var(--c1) 12%, var(--surface));
  stroke: var(--c1); stroke-width: var(--stroke);
  filter: drop-shadow(0 0 calc(var(--stroke) * 2.4) color-mix(in oklab, var(--c1) 70%, transparent));
  transition: filter .2s ease, stroke-width .2s ease;
}
.fm-node[data-kind="decision"] .fm-node-shape { stroke: var(--c2); fill: color-mix(in oklab, var(--c2) 12%, var(--surface)); filter: drop-shadow(0 0 calc(var(--stroke) * 2.4) color-mix(in oklab, var(--c2) 70%, transparent)); }
.fm-node[data-kind="terminal"] .fm-node-shape { stroke: var(--c3); fill: color-mix(in oklab, var(--c3) 14%, var(--surface)); filter: drop-shadow(0 0 calc(var(--stroke) * 2.8) color-mix(in oklab, var(--c3) 80%, transparent)); }
.fm-node-rule { stroke: var(--c1); stroke-width: var(--stroke); }
.fm-node-label { fill: var(--ink); font-size: ${spec.fontSize}px; font-weight: 700; letter-spacing: .02em; }
.fm-node-icon { display: none; }
.fm-node[data-has-detail="true"] { cursor: pointer; }
.fm-node:hover .fm-node-shape, .fm-node:focus-visible .fm-node-shape { stroke-width: calc(var(--stroke) * 1.7); filter: drop-shadow(0 0 calc(var(--stroke) * 5) var(--c1)); }
.fm-node:focus-visible { outline: none; }
.fm-node[data-dimmed="true"] { opacity: .55; }
.fm-node[data-active="true"] .fm-node-shape { stroke: var(--c3); stroke-width: calc(var(--stroke) * 2); filter: drop-shadow(0 0 calc(var(--stroke) * 7) var(--c3)); }
.fm-edge { fill: none; stroke: var(--c1); stroke-width: var(--stroke); stroke-linecap: round; filter: drop-shadow(0 0 calc(var(--stroke) * 1.4) currentColor); }
.fm-edge[data-kind="dotted"] { stroke-dasharray: 1 12; }
.fm-edge[data-kind="thick"] { stroke-width: calc(var(--stroke) * 2); }
.fm-edge[data-back="true"] { stroke: var(--c4); stroke-dasharray: 14 10; }
.fm-edge-label { fill: var(--ink); font-size: ${spec.labelFontSize}px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.fm-edge-label-bg { fill: var(--ground); }
.fm-arrow { fill: var(--c1); }
.fm-arrow-alert { fill: var(--c4); }
`.trim(),
};

/* src/styles/executive-clean.js */
const __default_src_styles_executive_clean_js = {
  key: 'executive-clean',
  name: 'Executive Clean',
  dark: false,
  css: (t, spec) => `
.fm-root {
  ${Object.entries(t).map(([k, v]) => `${k}: ${v};`).join('\n  ')}
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --stroke: ${spec.stroke}px;
  --corner: ${spec.corner}px;
  background: var(--ground);
  font-family: var(--font);
  color: var(--ink);
}
.fm-svg { display: block; }
.fm-subgraph rect { fill: var(--surface-2); stroke: var(--border); stroke-width: var(--stroke); rx: calc(var(--corner) + 6px); }
.fm-subgraph text { fill: var(--ink-dim); font-size: ${spec.labelFontSize + 3}px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.fm-node-shape { fill: var(--surface); stroke: var(--c1); stroke-width: var(--stroke); transition: filter .18s ease, stroke-width .18s ease; }
.fm-node[data-kind="decision"] .fm-node-shape { stroke: var(--c2); fill: var(--c2-soft); }
.fm-node[data-kind="terminal"] .fm-node-shape { stroke: var(--c3); fill: var(--c3-soft); }
.fm-node-rule { stroke: var(--c1); stroke-width: var(--stroke); }
.fm-node-label { fill: var(--ink); font-size: ${spec.fontSize}px; font-weight: 650; }
.fm-node-icon { display: none; }
.fm-node[data-has-detail="true"] { cursor: pointer; }
.fm-node:hover .fm-node-shape, .fm-node:focus-visible .fm-node-shape { filter: drop-shadow(0 4px 14px rgb(0 0 0 / .18)); stroke-width: calc(var(--stroke) * 1.6); }
.fm-node:focus-visible { outline: none; }
.fm-node:focus-visible .fm-node-shape { stroke: var(--c2); }
.fm-node[data-dimmed="true"] { opacity: .55; }
.fm-node[data-active="true"] .fm-node-shape { stroke: var(--c3); stroke-width: calc(var(--stroke) * 2); filter: drop-shadow(0 0 18px var(--c3)); }
.fm-edge { fill: none; stroke: var(--c1); stroke-width: var(--stroke); stroke-linecap: round; }
.fm-edge[data-kind="dotted"] { stroke-dasharray: 2 10; }
.fm-edge[data-kind="thick"] { stroke-width: calc(var(--stroke) * 1.9); }
.fm-edge[data-back="true"] { stroke: var(--c4); stroke-dasharray: 12 9; }
.fm-edge-label { fill: var(--ink-dim); font-size: ${spec.labelFontSize}px; font-weight: 700; }
.fm-edge-label-bg { fill: var(--ground); }
.fm-arrow { fill: var(--c1); }
.fm-arrow-alert { fill: var(--c4); }
`.trim(),
};

/* src/styles/blueprint.js */
const __default_src_styles_blueprint_js = {
  key: 'blueprint',
  name: 'Blueprint',
  dark: true,
  css: (t, spec) => `
.fm-root {
  ${Object.entries(t).map(([k, v]) => `${k}: ${v};`).join('\n  ')}
  --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stroke: ${Math.max(1, spec.stroke * 0.7)}px;
  --corner: 2px;
  background:
    repeating-linear-gradient(0deg, color-mix(in oklab, var(--c1) 16%, transparent) 0 1px, transparent 1px ${Math.round(spec.laneGap / 2)}px),
    repeating-linear-gradient(90deg, color-mix(in oklab, var(--c1) 16%, transparent) 0 1px, transparent 1px ${Math.round(spec.laneGap / 2)}px),
    var(--ground);
  font-family: var(--font);
  color: var(--ink);
}

const SAFE_URL = /^(https?:\/\/|mailto:|#|\/)/i;

// Inline spans. Input is already escaped, so these only add markup.
function inline(text) {
  return text
    .replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_whole, label, href) => {
      const url = href.replace(/&amp;/g, '&');
      if (!SAFE_URL.test(url)) return label;
      return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    });

const isTableDivider = (line) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(line) && line.includes('-');

function mdToHtml(md) {
  const source = String(md ?? '').replace(/\r\n?/g, '\n').trimEnd();
  if (source.trim() === '') return '';

  const lines = source.split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim() === '') {
      i += 1;
      continue;
    }

    // Fenced code: emit verbatim, escaped.
    const fence = line.match(/^\s*(`{3,}|~{3,})\s*(\S*)\s*$/);
    if (fence) {
      const body = [];
      i += 1;
      while (i < lines.length && !new RegExp(`^\\s*${fence[1][0]}{3,}\\s*$`).test(lines[i])) {
        body.push(lines[i]);
        i += 1;
      }
      i += 1;
      out.push(`<pre><code>${esc(body.join('\n'))}</code></pre>`);
      continue;
    }

    // Table: a header row followed by a divider row.
    if (line.includes('|') && isTableDivider(lines[i + 1] ?? '')) {
      const head = cells(line).map((c) => `<th>${inline(esc(c))}</th>`).join('');
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
        body.push(`<tr>${cells(lines[i]).map((c) => `<td>${inline(esc(c))}</td>`).join('')}</tr>`);
        i += 1;
      }
      out.push(`<table><thead><tr>${head}</tr></thead><tbody>${body.join('')}</tbody></table>`);
      continue;
    }

    // Headings: h3 and below, so a modal never competes with the page h1/h2.
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      const level = Math.min(6, Math.max(3, heading[1].length));
      out.push(`<h${level}>${inline(esc(heading[2].trim()))}</h${level}>`);
      i += 1;
      continue;
    }

    // Blockquote.
    if (/^\s*>/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        body.push(lines[i].replace(/^\s*>\s?/, ''));
        i += 1;
      }
      out.push(`<blockquote>${inline(esc(body.join(' ')))}</blockquote>`);
      continue;
    }

    // Lists.
    const bullet = /^\s*[-*+]\s+(.*)$/;
    const numbered = /^\s*\d+[.)]\s+(.*)$/;
    if (bullet.test(line) || numbered.test(line)) {
      const ordered = numbered.test(line);
      const re = ordered ? numbered : bullet;
      const items = [];
      while (i < lines.length && re.test(lines[i])) {
        items.push(`<li>${inline(esc(lines[i].match(re)[1]))}</li>`);
        i += 1;
      }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.join('')}</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }

    // Paragraph: consume until a blank line or a construct starts.
    const para = [];
    while (i < lines.length && lines[i].trim() !== ''
      && !/^\s*(#{1,6}\s|>|[-*+]\s|\d+[.)]\s|`{3,}|~{3,})/.test(lines[i])
      && !(lines[i].includes('|') && isTableDivider(lines[i + 1] ?? ''))) {
      para.push(lines[i].trim());
      i += 1;
    }
    if (para.length) out.push(`<p>${inline(esc(para.join(' ')))}</p>`);
  }

  return out.join('\n');
}

// Rank-major, order-minor. Guarantees termination on cyclic graphs and reads
// left-to-right on screen, which is what a booth audience follows.
function walkOrder(model) {
  return [...(model.nodes ?? [])]
    .map((n, i) => ({ id: n.id, rank: n.rank ?? 0, order: n.order ?? 0, i }))
    .sort((a, b) => (a.rank - b.rank) || (a.order - b.order) || (a.i - b.i))
    .map((n) => n.id);
}

function createAnimator(root, model, opts = {}) {
  const doc = root.ownerDocument;
  const svg = root.querySelector('svg');

    ?? (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const state = {
    mode: reduced ? 'off' : (opts.mode ?? 'pulse'),
    playing: false,
    paused: false,

  // One dot per edge, positioned with CSS motion paths so the dot follows the
  // exact routed geometry, including the back-edge gutter arcs.

    clearPulses();
    if (!svg) return;
    const spec = model.density === 'marquee' ? 7 : model.density === 'compact' ? 3 : 4.5;
    pulseLayer = doc.createElementNS('http://www.w3.org/2000/svg', 'g');
    pulseLayer.setAttribute('class', 'fm-layer-pulses');
    pulseLayer.setAttribute('aria-hidden', 'true');
    const duration = PULSE_MS[model.density] ?? PULSE_MS.standard;
    model.edges.forEach((e, i) => {
      if (!e.path) return;
      const dot = doc.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('class', 'fm-pulse');
      dot.setAttribute('cx', '0');

      dot.style.animationDelay = `${(i % 5) * (duration / 5)}ms`;

    const activeId = order[state.activeIndex];
    for (const el of root.querySelectorAll('.fm-node')) {

      el.dataset.active = isActive ? 'true' : 'false';
      el.dataset.dimmed = state.mode === 'walkthrough' && !isActive ? 'true' : 'false';

    for (const el of root.querySelectorAll('.fm-node')) {

    state.activeIndex = (state.activeIndex + 1) % Math.max(1, order.length);

      timer = null;
    }

  function startTimer() {

    },
    stop() {
      state.playing = false;
      stopTimer();
    },
    pause() {
      state.paused = true;
      root.dataset.paused = 'true';
      stopTimer();
    },
    resume() {

function estimate(label, { fontSize, padX, padY, minNodeW, nodeH }) {
  const charW = fontSize * 0.58;
  const maxTextW = MAX_LABEL_W - padX * 2;
  const oneLineW = String(label).length * charW;
  const lines = Math.max(1, Math.ceil(oneLineW / maxTextW));
  return {
    w: Math.round(Math.min(MAX_LABEL_W, Math.max(minNodeW, oneLineW + padX * 2))),
    h: Math.round(Math.max(nodeH, lines * fontSize * 1.35 + padY * 2)),
  };
}

// Real measurement with the actual font, so a browser layout matches what the
// user sees. Falls back to the estimator under Node so layout stays testable.
function browserMeasure(spec, fontFamily) {
  if (typeof document === 'undefined') return (label) => estimate(label, spec);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('data-fm-measure', 'true');
  svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;visibility:hidden';
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('font-size', String(spec.fontSize));
  text.setAttribute('font-family', fontFamily);
  text.setAttribute('font-weight', '700');
  svg.appendChild(text);
  document.body.appendChild(svg);

  const widthOf = (s) => {
    text.textContent = s;
    try {
      return text.getComputedTextLength();
    } catch {
      return s.length * spec.fontSize * 0.58;
    }
  };

  return (label) => {
    const maxTextW = MAX_LABEL_W - spec.padX * 2;
    const words = String(label).split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const word of words) {
      const candidate = line ? `${line} ${word}` : word;
      if (line && widthOf(candidate) > maxTextW) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    }
    if (line) lines.push(line);
    const widest = lines.length ? Math.max(...lines.map(widthOf)) : 0;
    return {
      w: Math.round(Math.min(MAX_LABEL_W, Math.max(spec.minNodeW, widest + spec.padX * 2))),
      h: Math.round(Math.max(spec.nodeH, Math.max(1, lines.length) * spec.fontSize * 1.35 + spec.padY * 2)),
      lines,
    };
  };
}

  for (const el of document.querySelectorAll('svg[data-fm-measure="true"]')) el.remove();
}

  { shape: 'subroutine', open: '[[', close: ']]' },
  { shape: 'cylinder', open: '[(', close: ')]' },

    byRank.get(n.rank).push(n);
  }
  const rankNums = [...byRank.keys()].sort((a, b) => a - b);
  for (const r of rankNums) byRank.get(r).sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));

  const mainSizeOf = (n) => (horizontal ? n.w : n.h);
  const crossSizeOf = (n) => (horizontal ? n.h : n.w);

  const rankMain = new Map();
  const rankMainSize = new Map();
  let cursor = 0;
  for (const r of rankNums) {
    const size = Math.max(...byRank.get(r).map(mainSizeOf));
    rankMain.set(r, cursor);
    rankMainSize.set(r, size);
    cursor += size + spec.rankGap;
  }
  const mainExtent = Math.max(0, cursor - spec.rankGap);

  const rankCross = new Map();
  for (const r of rankNums) {
    const list = byRank.get(r);
    rankCross.set(r, list.reduce((sum, n) => sum + crossSizeOf(n), 0) + spec.laneGap * (list.length - 1));
  }
  const crossExtent = Math.max(...rankCross.values());

  for (const r of rankNums) {
    const list = byRank.get(r);
    let c = (crossExtent - rankCross.get(r)) / 2;
    for (const n of list) {
      const main = rankMain.get(r) + (rankMainSize.get(r) - mainSizeOf(n)) / 2;
      if (horizontal) {
        n.x = main;
        n.y = c;
      } else {
        n.y = main;
        n.x = c;
      }
      c += crossSizeOf(n) + spec.laneGap;
    }
  }

  if (direction === 'RL') for (const n of nodes) n.x = mainExtent - n.x - n.w;
  if (direction === 'BT') for (const n of nodes) n.y = mainExtent - n.y - n.h;

  const nodeById = new Map(nodes.map((n) => [n.id, n]));
  const subgraphs = (graph.subgraphs ?? []).map((sg) => {
    const members = sg.nodeIds.map((id) => nodeById.get(id)).filter(Boolean);
    if (members.length === 0) return { id: sg.id, label: sg.label, x: 0, y: 0, w: 0, h: 0 };
    const x = Math.min(...members.map((n) => n.x)) - SUBGRAPH_PAD;
    const y = Math.min(...members.map((n) => n.y)) - SUBGRAPH_PAD - SUBGRAPH_HEADER;
    return {
      id: sg.id,
      label: sg.label,
      x,
      y,
      w: Math.max(...members.map((n) => n.x + n.w)) + SUBGRAPH_PAD - x,
      h: Math.max(...members.map((n) => n.y + n.h)) + SUBGRAPH_PAD - y,
    };
  });

  // Shift everything positive: subgraph headers can push above the origin.
  const dx = -Math.min(0, ...nodes.map((n) => n.x), ...subgraphs.map((s) => s.x));
  const dy = -Math.min(0, ...nodes.map((n) => n.y), ...subgraphs.map((s) => s.y));
  for (const n of nodes) {
    n.x = round(n.x + dx);
    n.y = round(n.y + dy);
  }
  for (const s of subgraphs) {
    s.x = round(s.x + dx);
    s.y = round(s.y + dy);
  }

  const nodeBottom = Math.max(...nodes.map((n) => n.y + n.h), ...subgraphs.map((s) => s.y + s.h));
  const nodeRight = Math.max(...nodes.map((n) => n.x + n.w), ...subgraphs.map((s) => s.x + s.w));
  const gutter = spec.laneGap + spec.rankGap * 0.35;

  const anchorsOf = (n) => ({
    out: horizontal ? { x: n.x + n.w, y: n.y + n.h / 2 } : { x: n.x + n.w / 2, y: n.y + n.h },
    in: horizontal ? { x: n.x, y: n.y + n.h / 2 } : { x: n.x + n.w / 2, y: n.y },
    outRev: horizontal ? { x: n.x, y: n.y + n.h / 2 } : { x: n.x + n.w / 2, y: n.y },
    inRev: horizontal ? { x: n.x + n.w, y: n.y + n.h / 2 } : { x: n.x + n.w / 2, y: n.y + n.h },
    bottom: { x: n.x + n.w / 2, y: n.y + n.h },
  });
  const reversed = direction === 'RL' || direction === 'BT';

  let backIndex = 0;
  const edges = (graph.edges ?? []).map((e) => {
    const from = nodeById.get(e.from);
    const to = nodeById.get(e.to);
    const isBackEdge = backSet.has(`${e.from} ${e.to} ${e.label}`);
    if (!from || !to) return { ...e, isBackEdge, path: '', labelPos: { x: 0, y: 0 } };

    const a = anchorsOf(from);
    const b = anchorsOf(to);
    let points;

    if (e.from === e.to) {
      const drop = from.h * 0.75;
      points = [
        { x: from.x + from.w * 0.3, y: from.y + from.h },
        { x: from.x + from.w * 0.3, y: from.y + from.h + drop },
        { x: from.x + from.w * 0.7, y: from.y + from.h + drop },
        { x: from.x + from.w * 0.7, y: from.y + from.h },
      ];
    } else if (isBackEdge) {
      // Dip into the reserved gutter beneath every node, travel against the
      // flow, and rise into the target. Each back edge gets its own lane.
      const lane = nodeBottom + gutter * 0.5 + backIndex * (spec.laneGap * 0.8);
      backIndex += 1;
      points = [a.bottom, { x: a.bottom.x, y: lane }, { x: b.bottom.x, y: lane }, b.bottom];
    } else {
      const start = reversed ? a.outRev : a.out;
      const end = reversed ? b.inRev : b.in;
      const mid = horizontal ? (start.x + end.x) / 2 : (start.y + end.y) / 2;
      points = horizontal
        ? [start, { x: mid, y: start.y }, { x: mid, y: end.y }, end]
        : [start, { x: start.x, y: mid }, { x: end.x, y: mid }, end];
    }

    const half = Math.floor(points.length / 2);
    const midPoint = points[half];
    const prevPoint = points[half - 1] ?? midPoint;
    return {
      ...e,
      isBackEdge,
      path: roundedPath(points, Math.min(spec.corner * 1.5, 26)),
      labelPos: { x: round((midPoint.x + prevPoint.x) / 2), y: round((midPoint.y + prevPoint.y) / 2) },
    };
  });

  const backDepth = backIndex > 0 ? gutter * 0.5 + backIndex * (spec.laneGap * 0.8) + spec.laneGap : 0;
  const selfDepth = edges.some((e) => e.from === e.to) ? spec.nodeH : 0;

  return {
    nodes,
    edges,
    subgraphs,
    direction,
    density: densityKey,
    bounds: {
      w: round(nodeRight + spec.laneGap),
      h: round(nodeBottom + Math.max(backDepth, selfDepth) + spec.laneGap),
    },
  };
}

const PALETTE_KEYS = PALETTES.map((p) => p.key);

function pick(field, value, allowed, fallback, warnings) {
  if (value === null || value === undefined) return fallback;
  if (allowed.includes(value)) return value;
  warnings.push({
    code: 'INVALID_META_VALUE',
    message: `"${value}" is not a valid ${field}. Using "${fallback}". Valid values: ${allowed.join(', ')}.`,
  });
  return fallback;
}
function resolveDocument(mdText, overrides = {}, measure) {
  const doc = parseDocument(mdText);
  const warnings = [...doc.warnings];

  const graph = parseMermaid(doc.mermaidSrc);
  warnings.push(...graph.warnings);

  const meta = {
    title: doc.meta.title ?? 'Untitled Flow',
    subtitle: doc.meta.subtitle ?? '',
    style: overrides.style ?? pick('style', doc.meta.style, STYLE_KEYS, DEFAULTS.style, warnings),
    palette: overrides.palette ?? pick('palette', doc.meta.palette, PALETTE_KEYS, DEFAULTS.palette, warnings),
    density: overrides.density ?? pick('density', doc.meta.density, DENSITY_KEYS, DEFAULTS.density, warnings),
    direction: overrides.direction
      ?? pick('direction', doc.meta.direction, DIRECTION_KEYS, graph.direction ?? DEFAULTS.direction, warnings),
  };

  // The cross-check parse.js could not do: it has no node list.
  const nodeIds = new Set(graph.nodes.map((n) => n.id));
  const orphans = Object.keys(doc.details).filter((id) => !nodeIds.has(id));
  if (orphans.length) {
    warnings.push({
      code: 'UNMATCHED_DETAIL',
      message: `These detail sections match no node in the diagram: ${orphans.join(', ')}. Node IDs are case-sensitive.`,
    });
  }
  const undocumented = [...nodeIds].filter((id) => !(id in doc.details));
  if (undocumented.length) {
    warnings.push({
      code: 'MISSING_DETAIL',
      message: `These steps have no detail section, so they render without a tooltip or modal: ${undocumented.join(', ')}.`,
    });
  }

  const model = layout(graph, {
    direction: meta.direction,
    density: meta.density,
    measure,
    iconSpace: showIconsFor(meta.style),
  });

  return { meta, graph, details: doc.details, model, warnings, mermaidSrc: doc.mermaidSrc };
}

const STORE_KEY = 'flowmaker.prefs.v1';
const FONT_STACK = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

const SAMPLE_FILES = [
  ['order-processing.md', 'Order Processing'],
  ['product-development-lifecycle.md', 'Product Development Lifecycle'],
  ['interviewing-and-selection.md', 'Interviewing & Selection'],
  ['customer-onboarding-kyc.md', 'Customer Onboarding & KYC'],
  ['incident-response.md', 'Incident Response'],
];

const STARTER_DOC = `---
title: Untitled Flow
subtitle: Paste your mermaid here, or load a sample
style: infographic
palette: harbor
direction: LR
density: standard
---

\`\`\`mermaid
flowchart LR
  A([Start]) --> B[Review Document]
  B --> C{Looks right?}
  C -->|No| B
  C -->|Yes| D[Capture Payment]
  D --> E([Done])
\`\`\`

## A — Start
> Where the flow begins, before any work has been done.

Replace this document with your own. Every node needs a matching \`## <id> — <Title>\` section.

## B — Review Document
> The main step, where the actual work happens.

The first blockquote becomes the hover tooltip. Everything after it becomes the click-through detail card, and it can hold lists, tables, links, and code.

## C — Looks right?
> A decision that can send the work back around for another pass.

Loop-backs are drawn in the alert colour beneath the main spine, so a rework cycle reads as intentional rather than as a layout mistake.

## D — Capture Payment
> A step whose label resolves an icon automatically in the Infographic style.

Icons come from the node label first, then from the mermaid shape. You can also force one with \`D:::icon-money\`.

## E — Done
> The terminal state, coloured with the accent swatch in every style.

Terminal nodes use the stadium or circle shapes and pick up the third palette swatch automatically.
`;

function loadPrefs() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function savePrefs(prefs) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(prefs));
  } catch {
    /* private mode: preferences simply do not persist */
  }
}

function mountStudio(root) {
  const state = {
    source: STARTER_DOC,
    overrides: loadPrefs(),
    animationMode: 'pulse',
    autoScroll: true,
    presenting: false,
    resolved: null,
    canvas: null,
    runtime: null,
  };

  root.innerHTML = STUDIO_HTML;
  const el = (sel) => root.querySelector(sel);
  const styleTag = el('#fm-style-tag');
  const editor = el('#fm-editor');
  const canvasHost = el('#fm-canvas');
  const stage = el('#fm-stage');
  const codeOut = el('#fm-code-out');
  const mermaidOut = el('#fm-mermaid-out');
  const warnStrip = el('#fm-warnings');
  const fmRoot = root.querySelector('.fm-root');

  el('#fm-style-list').innerHTML = STYLES.map((s) => `
    <button type="button" class="fm-swatch-card" data-style="${s.key}" aria-pressed="false">
      <span class="fm-swatch-card-name">${s.name}</span>
    </button>`).join('');

  el('#fm-palette-list').innerHTML = PALETTES.map((p) => `
    <button type="button" class="fm-palette-chip" data-palette="${p.key}" aria-pressed="false" title="${p.name}">
      <span style="background:${p.c1}"></span><span style="background:${p.c2}"></span>
      <span style="background:${p.c3}"></span><span style="background:${p.c4}"></span>
      <em>${p.name}</em>
    </button>`).join('');

  el('#fm-density').innerHTML = DENSITY_KEYS
    .map((d) => `<option value="${d}">${d[0].toUpperCase()}${d.slice(1)}</option>`).join('');
  el('#fm-direction').innerHTML = DIRECTION_KEYS
    .map((d) => `<option value="${d}">${d}</option>`).join('');

  function exportInput() {
    const r = state.resolved;
    return {
      meta: r.meta,
      graph: r.graph,
      details: r.details,
      styleKey: r.meta.style,
      paletteKey: r.meta.palette,
      density: r.meta.density,
      direction: r.meta.direction,
      animationMode: state.animationMode,
      autoScroll: state.autoScroll,
    };
  }

  function refreshExport() {
    codeOut.textContent = buildExport(exportInput(), { runtimeJs: window.__FM_RUNTIME_BUNDLE__ ?? '' });
  }

  function render() {
    const spec = DENSITY[state.overrides.density ?? 'standard'] ?? DENSITY.standard;
    const measure = browserMeasure(spec, FONT_STACK);
    const resolved = resolveDocument(state.source, state.overrides, measure);
    state.resolved = resolved;

    const activeStyle = getStyle(resolved.meta.style);
    const palette = getPalette(resolved.meta.palette);
    const tokens = deriveTokens(palette, { dark: activeStyle.dark });

    styleTag.textContent = [
      styleCss(activeStyle.key, tokens, resolved.meta.density),
      CANVAS_CSS,
      RUNTIME_CSS,
      ANIMATE_CSS,
    ].join('\n');
    fmRoot.dataset.fmStyle = activeStyle.key;

    state.runtime?.destroy();
    state.canvas?.destroy();

    stage.innerHTML = renderSvg(resolved.model, {
      styleKey: activeStyle.key,
      palette,
      meta: resolved.meta,
      details: resolved.details,
    });

    state.canvas = createCanvas(canvasHost, resolved.model, {
      onZoom: (z) => { el('#fm-zoom-label').textContent = `${Math.round(z * 100)}%`; },
    });
    state.runtime = attachRuntime(canvasHost, {
      details: resolved.details,
      model: resolved.model,
      animationMode: state.animationMode,
      scrollTo: (node) => state.canvas.scrollToNode(node),
      // Hovering a step, focusing it, or opening its card freezes the crawl too.
      onPause: () => state.canvas?.pauseAutoScroll(),
      onResume: () => state.canvas?.resumeAutoScroll(),
    });
    if (state.autoScroll ?? scrollDefaultFor(state.animationMode)) state.canvas.startAutoScroll();

    mermaidOut.textContent = resolved.mermaidSrc;
    refreshExport();

    for (const b of root.querySelectorAll('[data-style]')) {
      b.setAttribute('aria-pressed', String(b.dataset.style === activeStyle.key));
    }
    for (const b of root.querySelectorAll('[data-palette]')) {
      b.setAttribute('aria-pressed', String(b.dataset.palette === palette.key));
    }
    el('#fm-density').value = resolved.meta.density;
    el('#fm-direction').value = resolved.meta.direction;
    el('#fm-title').textContent = resolved.meta.title;
    el('#fm-present-title').textContent = resolved.meta.title;
    el('#fm-subtitle').textContent = resolved.meta.subtitle;

    warnStrip.hidden = resolved.warnings.length === 0;
    warnStrip.innerHTML = resolved.warnings
      .map((w) => `<li><code>${w.code}</code> ${w.message.replace(/</g, '&lt;')}</li>`).join('');

    savePrefs({ style: resolved.meta.style, palette: resolved.meta.palette, density: resolved.meta.density });
  }

  // Pulse travels the flow, so the crawl rides with it. A walkthrough already
  // scrolls itself to each active step, so a second scroller would fight it.
  function scrollDefaultFor(mode) {
    return mode === 'pulse';
  }

  function setAutoScroll(on) {
    state.autoScroll = on;
    if (on) state.canvas?.startAutoScroll();
    else state.canvas?.stopAutoScroll();
    for (const b of root.querySelectorAll('[data-action="toggle-scroll"]')) {
      b.setAttribute('aria-pressed', String(on));
    }
  }

  function setPresenting(on) {
    state.presenting = on;
    root.dataset.present = String(on);
    el('#fm-present-bar').hidden = !on;
    el('#fm-present-title').textContent = state.resolved?.meta.title ?? '';
    // A booth screen wants the crawl running; leaving present mode restores
    // whatever the user had before.
    if (on) {
      state.scrollBeforePresent = state.autoScroll;
      setAutoScroll(true);
      root.requestFullscreen?.().catch(() => { /* denied: the in-page mode still applies */ });
      el('.fm-present-exit').focus();
    } else {
      setAutoScroll(state.scrollBeforePresent ?? false);
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    }
    // The canvas changed size, so re-fit to the new viewport.
    requestAnimationFrame(() => state.canvas?.fitDefault());
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.presenting) setPresenting(false);
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && state.presenting) setPresenting(false);
  });

  let debounce = null;
  editor.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      state.source = editor.value;
      render();
    }, 250);
  });

  async function loadText(text) {
    state.source = text;
    editor.value = text;
    state.overrides = {};
    render();
  }

  el('#fm-upload').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (file) await loadText(await file.text());
  });

  root.addEventListener('dragover', (e) => {
    e.preventDefault();
    root.dataset.dropping = 'true';
  });
  root.addEventListener('dragleave', () => { root.dataset.dropping = 'false'; });
  root.addEventListener('drop', async (e) => {
    e.preventDefault();
    root.dataset.dropping = 'false';
    const file = e.dataTransfer?.files?.[0];
    if (file) await loadText(await file.text());
  });

  el('#fm-samples').addEventListener('change', async (e) => {
    const name = e.target.value;

  });

  root.addEventListener('click', (e) => {
    const styleBtn = e.target.closest('[data-style]');
    if (styleBtn) {
      state.overrides.style = styleBtn.dataset.style;
      render();
      return;
    }
    const palBtn = e.target.closest('[data-palette]');
    if (palBtn) {
      state.overrides.palette = palBtn.dataset.palette;
      render();
      return;
    }
    const flip = e.target.closest('[data-flip]');
    if (flip) {
      const card = root.querySelector(`#${flip.dataset.flip}`);
      card.dataset.face = flip.dataset.face;
      for (const t of root.querySelectorAll(`[data-flip="${flip.dataset.flip}"]`)) {
