      return;
    }
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (!action) return;
    if (action === 'zoom-in') state.canvas.zoomBy(1.2);
    if (action === 'zoom-out') state.canvas.zoomBy(1 / 1.2);
    if (action === 'fit-width') state.canvas.fitWidth();
    if (action === 'fit-height') state.canvas.fitHeight();
    if (action === 'actual') state.canvas.actualSize();
    if (action.startsWith('anim-')) {
      state.animationMode = action.slice(5);
      state.runtime.setAnimationMode(state.animationMode);
      for (const b of root.querySelectorAll('[data-action^="anim-"]')) {
        b.setAttribute('aria-pressed', String(b.dataset.action === action));
      }
      setAutoScroll(scrollDefaultFor(state.animationMode));
      refreshExport();
    }
    if (action === 'toggle-scroll') setAutoScroll(!state.autoScroll);
    if (action === 'present') setPresenting(true);
    if (action === 'exit-present') setPresenting(false);
    if (action === 'copy-code') navigator.clipboard?.writeText(codeOut.textContent);
    if (action === 'download') {
      const blob = new Blob([codeOut.textContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(state.resolved.meta.title || 'flow').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.html`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  });

  for (const [id, key] of [['fm-density', 'density'], ['fm-direction', 'direction']]) {
    el(`#${id}`).addEventListener('change', (ev) => {
      state.overrides[key] = ev.target.value;
      render();
    });
  }

  editor.value = state.source;
  render();
  const api = { render, state };
  // Handy for debugging in the console and for driving the app from tests.
  if (typeof window !== 'undefined') window.__flowmaker = api;
  return api;
}

window.__FM_SAMPLES__ = {"customer-onboarding-kyc.md":"---\ntitle: Customer Onboarding and KYC\nsubtitle: Signup through identity verification, risk scoring, and account activation\nstyle: executive-clean\npalette: forest\ndirection: LR\ndensity: standard\n---\n\n```mermaid\nflowchart LR\n  SIGNUP([Signup Started]) --> COLLECT[Collect Applicant Details]\n  COLLECT --> DOCS[Capture Identity Documents]\n  DOCS --> VERIFY{Documents Verified?}\n  VERIFY -->|Unreadable| DOCS\n  VERIFY -->|Verified| SCREEN[Sanctions and PEP Screening]\n  SCREEN --> RISK[Calculate Risk Score]\n  RISK --> TIER{Risk Tier}\n  TIER -->|High| EDD[Enhanced Due Diligence]\n  TIER -->|Medium| MANUAL[Manual Review Queue]\n  EDD --> MANUAL\n  MANUAL -->|More information needed| DOCS\n  MANUAL --> OUTCOME{Review Outcome}\n  OUTCOME -->|Refused| REFUSED([Application Refused])\n  OUTCOME -->|Approved| PROVISION[Provision the Account]\n  TIER -->|Low| PROVISION\n  PROVISION --> ACTIVATE([Account Active])\n```\n\n## SIGNUP — Signup Started\n\n> A prospective customer begins an application through the web or mobile channel.\n\nThe application record is created on the first keystroke, not on submit. Partial applications are the single richest source of drop-off data, and discarding them means never learning where onboarding actually loses people.\n\n| Captured | Purpose |\n| --- | --- |\n| Channel and device | Attribution and fraud signal |\n| Timestamp | Regulatory record of first contact |\n| Partial form state | Resume, and drop-off analysis |\n\n**Owner:** Growth · **Emits:** `application.started`\n\n## COLLECT — Collect Applicant Details\n\n> Gathers legal name, date of birth, residential address, and tax identifiers.\n\nOnly what is legally required or operationally necessary is collected. Every additional field costs conversion measurably, so each one must be justified by a regulation or a decision it actually feeds.\n\n- Legal name exactly as it appears on the identity document\n- Date of birth, validated for the minimum age\n- Residential address, normalised and checked for deliverability\n- Tax identification number where the jurisdiction requires it\n\n**Owner:** Onboarding · **Target:** under 3 minutes for the applicant\n\n## DOCS — Capture Identity Documents\n\n> The applicant photographs a government identity document and completes a liveness check.\n\nCapture happens on the device camera with real-time guidance, because the dominant cause of verification failure is a poor photograph rather than a fraudulent one. Glare, crop, and focus are checked before upload.\n\nThe liveness check binds the person present to the document, which is what distinguishes verification from a stolen document being photographed.\n\nThis step receives two loop-backs: unreadable documents, and manual reviews requesting additional evidence. Both re-enter here.\n\n**Owner:** Onboarding · **Receives loop-backs from:** document verification, manual review\n\n## VERIFY — Documents Verified?\n\n> Automated checks confirm the document is genuine, unexpired, and matches the applicant.\n\nVerification runs three independent checks: document authenticity against known security features, data consistency between the document and the submitted details, and a biometric match between the liveness capture and the document photograph.\n\nAn unreadable submission is not a failure and is never treated as one. It returns to capture with a specific instruction, such as which corner was cut off. A genuine mismatch escalates rather than looping.\n\n**Owner:** Identity operations · **Loops back to:** Capture Identity Documents\n\n## SCREEN — Sanctions and PEP Screening\n\n> The verified identity is screened against sanctions, watchlists, and politically exposed person lists.\n\nScreening is mandatory and non-negotiable regardless of risk tier. It runs against the consolidated lists on every onboarding and is re-run periodically for the life of the relationship.\n\nFuzzy matching produces false positives by design, since the cost of a missed true match vastly exceeds the cost of a manual review. Every hit is adjudicated by a human and the adjudication is recorded permanently.\n\n**Owner:** Compliance · **Regulatory basis:** anti-money-laundering obligations\n\n## RISK — Calculate Risk Score\n\n> A composite score is computed from geography, product, channel, screening results, and behaviour.\n\nThe model is deliberately explainable. A regulator, or a refused applicant, may ask why a decision was made, and \"the model said so\" is not a defensible answer.\n\n| Factor | Weight |\n| --- | --- |\n| Jurisdiction risk rating | High |\n| Product risk category | High |\n| Screening adjudication outcome | High |\n| Channel and device signals | Medium |\n| Application behaviour anomalies | Medium |\n\n**Owner:** Risk · **Property:** every score carries the factors that produced it\n\n## TIER — Risk Tier\n\n> The score routes the application to straight-through processing, manual review, or enhanced diligence.\n\nTiering is where the economics of onboarding are decided. The majority of applicants are low risk and should never meet a human, which is what makes it affordable to give genuine attention to the minority who need it.\n\nThresholds are reviewed quarterly against outcomes. A tier that never produces a refusal is set too loose; one that refuses good customers is set too tight.\n\n**Owner:** Risk and Compliance · **Distribution target:** roughly 80% low, 15% medium, 5% high\n\n## EDD — Enhanced Due Diligence\n\n> High risk applications receive deeper investigation before any human review decision.\n\nEnhanced diligence establishes source of funds and source of wealth, identifies beneficial ownership where the applicant is an entity, and gathers adverse media coverage.\n\nThis is slow, expensive, and correct. Rushing it is precisely how institutions end up in enforcement actions.\n\n- Source of funds and source of wealth evidence\n- Beneficial ownership to the required threshold\n- Adverse media search across relevant jurisdictions and languages\n\n**Owner:** Compliance · **Typical duration:** 3 to 10 business days\n\n## MANUAL — Manual Review Queue\n\n> A trained analyst reviews the full case file and either decides or requests more information.\n\nThe analyst sees everything: the documents, the screening adjudications, the risk factors, and the enhanced diligence findings if any. Partial context produces poor decisions and inconsistent outcomes.\n\nWhen the file is incomplete, the analyst requests specific additional evidence and the case returns to document capture. Requests name exactly what is needed, because a vague request produces another incomplete submission.\n\n**Owner:** Compliance operations · **Loops back to:** Capture Identity Documents\n\n## OUTCOME — Review Outcome\n\n> The analyst's decision: approve the relationship, or refuse it.\n\nThe decision and its full reasoning are recorded permanently. This record is the institution's evidence of a defensible process, and it is the first thing an examiner asks for.\n\nRefusals are subject to a second-analyst check, because a wrongly refused applicant has no easy route to appeal and the reputational cost is asymmetric.\n\n**Owner:** Compliance operations · **Retention:** the statutory record-keeping period\n\n## PROVISION — Provision the Account\n\n> Systems create the account, apply limits appropriate to the risk tier, and enable products.\n\nProvisioning is where the risk assessment becomes operational. Transaction limits, product eligibility, and monitoring sensitivity are all set from the tier assigned earlier, so risk is expressed as controls rather than as a filed document.\n\nLow-tier applicants arrive here directly from tiering without human involvement, which is the straight-through path the whole design optimises for.\n\n**Owner:** Platform · **Target:** under 30 seconds\n\n## ACTIVATE — Account Active\n\n> The customer receives credentials, completes first login, and the relationship begins.\n\nActivation completes onboarding and starts ongoing monitoring. Screening re-runs on a schedule, transaction monitoring begins immediately, and the risk score is refreshed as real behaviour accumulates.\n\nThe onboarding assessment is a starting position, not a permanent verdict. Behaviour after activation is more informative than anything gathered before it.\n\n**Owner:** Onboarding · **Terminal state**\n\n## REFUSED — Application Refused\n\n> The application is declined and the applicant is notified within the regulatory window.\n\nThe notification says what is legally permitted, which in many jurisdictions is deliberately limited to avoid tipping off. Analysts do not improvise here; the wording is pre-approved by legal.\n\nThe full case file is retained for the statutory period. Refusal is a record-keeping obligation, not a deletion event.\n\n**Owner:** Compliance · **Terminal state**\n","incident-response.md":"---\ntitle: Incident Response\nsubtitle: Detection through mitigation, verification, and the postmortem loop\nstyle: neon-circuit\npalette: signal\ndirection: LR\ndensity: standard\n---\n\n```mermaid\nflowchart LR\n  DETECT[Detect the Signal] --> TRIAGE[Triage the Alert]\n  TRIAGE --> SEV{Severity?}\n  SEV -->|Sev3 Low| MONITOR[Monitor and Log]\n  MONITOR --> MONITOR\n  SEV -->|Sev2 Degraded| ONCALL[Page the On-Call Engineer]\n  SEV -->|Sev1 Critical| ESCALATE[Escalate and Open a Bridge]\n  ESCALATE --> ONCALL\n  ONCALL --> COMMS[Notify Affected Customers]\n  ONCALL --> MITIGATE[Attempt Mitigation]\n  MITIGATE --> WORKED{Mitigated?}\n  WORKED -->|No| TRIAGE\n  WORKED -->|Needs rollback| ROLLBACK[Roll Back the Change]\n  ROLLBACK --> VERIFY[Verify Recovery]\n  WORKED -->|Yes| VERIFY\n  VERIFY --> STABLE{Stable?}\n  STABLE -->|Regressed| SEV\n  STABLE -->|Confirmed| RESOLVE[Resolve the Incident]\n  RESOLVE --> POSTMORTEM[Run the Postmortem]\n  POSTMORTEM --> ACTIONS[Track Action Items]\n  ACTIONS --> DETECT\n```\n\n## DETECT — Detect the Signal\n\n> Monitoring, synthetic checks, or a customer report indicate something is wrong in production.\n\nDetection sources are ranked by how much they cost the business. An alert that fires before customers notice is worth far more than one that confirms what support already knows.\n\n| Source | Typical share | Median time to detect |\n| --- | --- | --- |\n| Automated alerting | 70% | under 2 minutes |\n| Synthetic monitoring | 15% | under 5 minutes |\n| Customer report | 15% | 20 minutes or more |\n\nThis step also receives the outer loop: postmortem action items that improve detection land here as new or tuned alerts.\n\n**Owner:** Platform · **Receives loop-backs from:** action item tracking\n\n## TRIAGE — Triage the Alert\n\n> A responder establishes what is broken, for whom, and how badly, before doing anything else.\n\nTriage answers three questions: which user-facing capability is affected, what proportion of users are affected, and is it getting worse. Everything else can wait.\n\nThe strongest temptation in an incident is to start fixing before understanding, which routinely makes things worse. Triage exists specifically to resist that.\n\nThis step also receives failed mitigations. A mitigation that did not work means the diagnosis was wrong, so the correct response is to re-triage rather than to try another fix.\n\n**Owner:** On-call responder · **Receives loop-backs from:** failed mitigation\n\n## SEV — Severity?\n\n> Classifies the incident, which determines who is woken up and how fast.\n\nSeverity is defined by customer impact, not by technical alarm. A crashed background worker nobody depends on is not a Sev1; a checkout that fails for 2% of users is.\n\n- **Sev1** — critical function unavailable or data at risk; page immediately, open a bridge\n- **Sev2** — degraded experience or a partial outage; page the on-call engineer\n- **Sev3** — minor or contained; monitor and handle in business hours\n\nResponders are explicitly authorised to over-classify. Downgrading later is cheap; discovering at hour three that this was always a Sev1 is not.\n\n**Owner:** On-call responder · **Receives loop-backs from:** verification, when the fix regressed\n\n## MONITOR — Monitor and Log\n\n> Low severity issues are recorded and watched on a timer rather than escalated.\n\nThis step deliberately loops on itself. A Sev3 is re-checked on an interval, and the loop continues until it either resolves on its own or crosses a threshold that justifies escalation.\n\nSev3s are not ignored, they are queued. The log entry carries enough context that whoever picks it up in business hours does not start from nothing.\n\n**Owner:** On-call responder · **Self-loop:** re-checked every 30 minutes\n\n## ONCALL — Page the On-Call Engineer\n\n> The service owner is paged with the triage summary already attached.\n\nThe page carries the triage findings, not just an alert name. An engineer woken at 3am should not have to reconstruct what a responder already established.\n\nAcknowledgement is expected within five minutes. Unacknowledged pages escalate automatically to the secondary, then to the manager, because a page nobody answers is worse than no page at all.\n\n**Owner:** Service owner · **Acknowledgement target:** 5 minutes\n\n## ESCALATE — Escalate and Open a Bridge\n\n> Sev1 incidents open a coordination bridge with an incident commander and defined roles.\n\nThe commander coordinates and does not debug. The moment the commander starts typing into a terminal, coordination stops, and coordination is the scarce resource in a large incident.\n\nRoles are named explicitly at the start: commander, operations lead, communications lead, and scribe. Ambiguous roles produce duplicated work and dropped threads.\n\n**Owner:** Incident commander · **Applies to:** Sev1 only\n\n## COMMS — Notify Affected Customers\n\n> Customer communication runs in parallel with the technical response, not after it.\n\nThe first update goes out before the cause is known, because customers care about acknowledgement and expected duration far more than root cause. Silence is interpreted as incompetence.\n\nUpdates follow a fixed cadence for the incident's duration, even when the update is that there is nothing new. A predictable rhythm is itself reassuring.\n\n**Owner:** Communications lead · **Cadence:** every 30 minutes for Sev1\n\n## MITIGATE — Attempt Mitigation\n\n> Restore service by the fastest available means, which is rarely the same as fixing the bug.\n\nMitigation is explicitly not a fix. Failing over, shedding load, disabling a feature flag, or scaling out all restore service without understanding the defect, and understanding can happen once users are unblocked.\n\nEvery action is announced on the bridge before it is taken and recorded by the scribe. Two responders independently changing the same system is a common way to turn one incident into two.\n\n**Owner:** Operations lead · **Principle:** restore first, understand second\n\n## WORKED — Mitigated?\n\n> Did service actually recover, and if not, does the change need rolling back?\n\nThe judgement is made on the customer-facing signal, not on whether the intervention completed. A deploy that succeeded while the error rate stayed flat has not mitigated anything.\n\nThree outcomes: recovery confirmed, mitigation ineffective and the diagnosis must be revisited, or the incident is attributable to a recent change and rollback is the fastest safe path.\n\n**Owner:** Operations lead · **Loops back to:** Triage the Alert\n\n## ROLLBACK — Roll Back the Change\n\n> Revert to the last known good state when a recent deployment is the probable cause.\n\nRollback is preferred over forward-fixing during an active incident. A forward fix is untested code written under pressure by tired people, which is how second incidents are created.\n\nThe rollback path is rehearsed in normal operations. A rollback executed for the first time during a Sev1 is not a rollback plan, it is an experiment.\n\n**Owner:** Operations lead · **Target:** under 5 minutes\n\n## VERIFY — Verify Recovery\n\n> Confirm through independent signals that service is genuinely restored for real users.\n\nVerification uses signals independent of whatever was changed. If a cache was flushed to mitigate, verification cannot rely on that cache's own metrics.\n\nThe bar is real user traffic behaving correctly, sustained for long enough to rule out a transient recovery. A metric that recovers for ninety seconds and then degrades again has not recovered.\n\n**Owner:** Operations lead · **Minimum observation:** 15 minutes of clean signal\n\n## STABLE — Stable?\n\n> A sustained-recovery gate before anyone is allowed to declare the incident over.\n\nDeclaring victory early is one of the most common incident-response failures. It sends responders back to bed, dissolves the bridge, and forces a cold restart when the problem returns twenty minutes later.\n\nA regression routes back to severity classification rather than to triage, because a recurrence often warrants a higher severity than the original.\n\n**Owner:** Incident commander · **Loops back to:** Severity?\n\n## RESOLVE — Resolve the Incident\n\n> The incident is formally closed, the bridge stands down, and a final customer update is sent.\n\nClosure is explicit and announced. Responders need a clear end so that on-call rotation and fatigue can be managed honestly.\n\nThe final customer update confirms resolution and commits to a follow-up if the incident warrants a public writeup.\n\n**Owner:** Incident commander · **Emits:** the incident record with a full timeline\n\n## POSTMORTEM — Run the Postmortem\n\n> A blameless review of what happened, why the system allowed it, and what would have caught it sooner.\n\nBlameless means the analysis targets the system rather than the individual. People act reasonably given the information and tooling available to them; if the outcome was bad, the information or tooling was inadequate.\n\nThe postmortem is scheduled within five business days, while memory is accurate, and the incident timeline is reconstructed from the scribe's log rather than from recollection.\n\n**Owner:** Service owner · **Timebox:** within 5 business days\n\n## ACTIONS — Track Action Items\n\n> Action items get owners and due dates, and are tracked to completion like any other work.\n\nAn untracked action item is a postmortem that changed nothing. Each item has a single named owner, a due date, and a place in the normal backlog rather than a separate document nobody reopens.\n\nDetection-related actions close the outer loop of this diagram, feeding directly back into the alerting that starts the next incident earlier.\n\n**Owner:** Service owner · **Loops back to:** Detect the Signal\n","interviewing-and-selection.md":"---\ntitle: Interviewing and Selection\nsubtitle: From application to signed offer, including the paths that end early\nstyle: soft-depth\npalette: candy\ndirection: LR\ndensity: standard\n---\n\n```mermaid\nflowchart LR\n  APPLY([Application Received]) --> SCREEN[Screen Applications]\n  SCREEN --> FIT{Meets the Bar?}\n  FIT -->|No| REJECT([Rejected])\n  FIT -->|Yes| RECRUITER[Recruiter Conversation]\n  RECRUITER --> HM[Hiring Manager Interview]\n  HM --> LOOP[Technical Interview Loop]\n  LOOP --> DEBRIEF[Debrief the Panel]\n  DEBRIEF -->|Need more signal| LOOP\n  DEBRIEF --> DECIDE{Committee Decision}\n  DECIDE -->|No hire| REJECT\n  DECIDE -->|Hire| OFFER[Extend Offer]\n  OFFER --> NEGOTIATE{Offer Accepted?}\n  NEGOTIATE -->|Counter| OFFER\n  NEGOTIATE -->|Declined| DECLINED([Offer Declined])\n  NEGOTIATE -->|Accepted| ACCEPTED([Offer Accepted])\n```\n\n## APPLY — Application Received\n\n> A candidate applies directly, is referred by an employee, or is sourced by a recruiter.\n\nEvery application enters the same pipeline regardless of source. Referrals and sourced candidates get faster response times but not a lower bar, which is the distinction that keeps referral programmes from quietly degrading hiring quality.\n\n| Source | Typical share | Response target |\n| --- | --- | --- |\n| Direct application | 60% | 5 business days |\n| Employee referral | 25% | 2 business days |\n| Sourced | 15% | 2 business days |\n\n**Owner:** Recruiting · **Emits:** an application record with the source attributed\n\n## SCREEN — Screen Applications\n\n> A structured review of the written application against the role's defined must-haves.\n\nScreening uses the requirements written before the role opened, not impressions formed while reading. The must-haves are agreed with the hiring manager up front precisely so this step cannot drift.\n\n- Evidence of the core competency, in any form\n- No hard blockers such as work authorisation or location constraints the role cannot accommodate\n- A second reviewer on every rejection near the line\n\n**Owner:** Recruiting · **Target:** under 10 minutes per application\n\n## FIT — Meets the Bar?\n\n> The first real gate: is there enough evidence to justify the candidate's and the panel's time?\n\nThe question is not whether this person will get the job. It is whether a conversation is a reasonable use of an hour on both sides. Screening in too generously wastes candidate time, which is the more expensive error.\n\nRejections at this stage are sent within the response target with a clear, non-generic message. A candidate who is rejected well often applies again or refers someone.\n\n**Owner:** Recruiting · **Outcome:** advance, or reject with a written reason\n\n## RECRUITER — Recruiter Conversation\n\n> A 30 minute call covering motivation, logistics, compensation range, and role expectations.\n\nThis call exists to surface mismatches early. Compensation range, location expectations, and start date are discussed explicitly, because discovering a gap at the offer stage wastes everyone's investment.\n\nThe recruiter also sells honestly: what the team is actually like, what is hard about the role, and what the first six months look like. Overselling here produces regretted attrition later.\n\n**Owner:** Recruiting · **Duration:** 30 minutes\n\n## HM — Hiring Manager Interview\n\n> The hiring manager assesses experience depth, ways of working, and specific role fit.\n\nThe manager probes actual past work rather than hypotheticals. The most reliable predictor available in an interview is a detailed account of something the candidate genuinely did, examined closely enough that fabrication becomes obvious.\n\nThe manager also owns the candidate's experience from here on. A candidate should always know what happens next and when.\n\n**Owner:** Hiring manager · **Duration:** 45 to 60 minutes\n\n## LOOP — Technical Interview Loop\n\n> Three to four structured interviews, each assessing one competency with a defined rubric.\n\nInterviewers are assigned non-overlapping competencies so the panel gathers independent evidence rather than four opinions on the same thing. Each interviewer writes their assessment before seeing anyone else's, which prevents the first strong opinion from anchoring the rest.\n\nEvery candidate for the same role gets the same structure. Consistency is what makes comparison across candidates meaningful, and it is also the main defence against bias.\n\n**Owner:** The interview panel · **Loops back from:** the debrief, when a competency was not adequately covered\n\n## DEBRIEF — Debrief the Panel\n\n> Interviewers meet, present their written evidence, and identify gaps in the assessment.\n\nWritten assessments are submitted before the meeting and are not editable afterwards. The discussion is about evidence, not impressions, and interviewers are expected to say when they lack signal rather than filling the gap with instinct.\n\nWhen a competency genuinely was not assessed, the panel schedules one additional targeted interview rather than guessing. This loop is used sparingly, because an endless loop is its own answer.\n\n**Owner:** Hiring manager · **Loops back to:** Technical Interview Loop\n\n## DECIDE — Committee Decision\n\n> A committee independent of the hiring manager makes the final hire or no-hire call.\n\nSeparating the decision from the hiring manager protects against the pressure of an open role. A manager who needs someone now is not the ideal judge of whether this particular person clears the bar.\n\nThe committee reviews written evidence against the rubric, not the panel's enthusiasm. The default is no hire, and the evidence must move it.\n\n**Owner:** Hiring committee · **Default:** no hire, absent clear evidence\n\n## OFFER — Extend Offer\n\n> Compensation is set from the levelling guide and the offer is delivered verbally, then in writing.\n\nThe level comes from the panel's evidence and the levelling guide, not from what the candidate currently earns. The verbal conversation happens first so the candidate hears the reasoning and can ask questions before receiving a document.\n\nCounters return to this step. Room to move is agreed with finance before the first offer, so a counter can be answered in days rather than weeks.\n\n**Owner:** Recruiting and hiring manager · **Receives loop-backs from:** the negotiation\n\n## NEGOTIATE — Offer Accepted?\n\n> The candidate accepts, counters, or declines, and the counter path loops back to the offer.\n\nMost negotiations are about one or two specific things: base compensation, start date, or a particular commitment about the role. Identifying which one it is, rather than assuming it is money, resolves most cases quickly.\n\nA decline is recorded with its reason. A pattern of declines for the same reason is data about compensation bands or role design, not about individual candidates.\n\n**Owner:** Recruiting · **Loops back to:** Extend Offer\n\n## REJECT — Rejected\n\n> A terminal state reached from screening or from the committee decision.\n\nEvery rejected candidate receives a response. Candidates who reached the interview loop receive it from a human, with enough substance to be useful, delivered within two business days of the decision.\n\nRejection is not permanent. Candidates who were close are flagged for future roles with a note explaining what would change the answer.\n\n**Owner:** Recruiting · **Terminal state**\n\n## DECLINED — Offer Declined\n\n> The candidate turns down the offer and the requisition returns to the pipeline.\n\nThe declined reason is captured accurately, including when it is unflattering. Aggregated over a quarter, these reasons are the clearest available signal about competitiveness.\n\nThe relationship is maintained. A candidate who declined once and had a good experience is a strong future prospect and an even better referral source.\n\n**Owner:** Recruiting · **Terminal state**\n\n## ACCEPTED — Offer Accepted\n\n> The candidate signs, and the process hands off to onboarding.\n\nAcceptance is the start of a new risk window rather than the end of the process. The gap between signing and starting is where counter-offers and second thoughts happen, so contact continues through it.\n\nThe requisition closes and the panel receives the outcome, which is how interviewers calibrate over time.\n\n**Owner:** Recruiting · **Terminal state**\n","order-processing.md":"---\ntitle: Order Processing\nsubtitle: From cart confirmation to delivered shipment\nstyle: executive-clean\npalette: harbor\ndirection: LR\ndensity: standard\n---\n\n```mermaid\nflowchart LR\n  START([Order Placed]) --> VALIDATE[Validate Order]\n  VALIDATE --> AUTH{Payment Authorized?}\n  AUTH -->|Declined| RETRY[Request New Payment Method]\n  RETRY --> AUTH\n  AUTH -->|Approved| RESERVE[Reserve Inventory]\n  RESERVE --> STOCK{In Stock?}\n  STOCK -->|Backordered| BACKORDER[Place on Backorder]\n  BACKORDER --> RESERVE\n  STOCK -->|Available| PICK[Pick and Pack]\n  PICK --> SHIP[Hand to Carrier]\n  SHIP --> CAPTURE[Capture Payment]\n  CAPTURE --> DELIVERED([Delivered])\n```\n\n## START — Order Placed\n\n> The customer has confirmed the cart, shipping address, and payment method at checkout.\n\nThe storefront writes an immutable order record and emits an `order.placed` event. Everything downstream reads from that record rather than from the session, so a customer closing the browser never loses an order.\n\n| Field | Source |\n| --- | --- |\n| Line items | Cart service |\n| Shipping address | Address book or guest form |\n| Payment token | Gateway vault reference |\n\n**Owner:** Storefront team · **Target:** under 2 seconds at p95\n\n## VALIDATE — Validate Order\n\n> Checks addresses, availability signals, pricing, and fraud score before any money moves.\n\nValidation is intentionally cheap and runs before authorization, so obviously bad orders never reach the payment gateway and never count against authorization rate limits.\n\n- Address normalization and deliverability check\n- Repricing against the current catalog to catch stale cart prices\n- Fraud score from the risk service; anything above the threshold routes to manual review\n\n**Owner:** Order management · **Failure mode:** rejected orders return to the cart with a specific reason code.\n\n## AUTH — Payment Authorized?\n\n> The gateway places a hold on the full order total, including tax and shipping.\n\nAuthorization is a hold, not a charge. Funds are captured later, only once the parcel is actually handed to the carrier, which keeps the business on the right side of card network rules about charging before shipment.\n\nDeclines split into two groups. Soft declines (insufficient funds, temporary issuer block) are worth retrying with the same instrument. Hard declines (stolen card, closed account) must not be retried and route straight to a new payment method.\n\n**Owner:** Payments · **Target:** under 1.5 seconds at p95\n\n## RETRY — Request New Payment Method\n\n> Asks the customer for a different card after a decline, then re-attempts authorization.\n\nThe customer receives an email and an in-app prompt with the decline reason expressed in plain language. The order stays open for 72 hours, holding its place in the fulfillment queue, before it is cancelled automatically.\n\nThis is a genuine loop: a customer may cycle through several instruments. The loop is capped at five attempts to avoid triggering issuer fraud heuristics.\n\n**Owner:** Payments · **Loops back to:** Payment Authorized?\n\n## RESERVE — Reserve Inventory\n\n> Places a soft hold on each line item in the warehouse nearest the destination.\n\nReservation is what stops two customers buying the last unit. The hold is soft and expires after 30 minutes, so an abandoned or failed order releases stock automatically rather than requiring a compensating transaction.\n\nAllocation prefers the warehouse that can ship the whole order in one parcel, falling back to a split shipment only when no single site holds everything.\n\n**Owner:** Inventory · **Target:** under 500 milliseconds\n\n## STOCK — In Stock?\n\n> Confirms that every reserved line item is physically available at the allocated warehouse.\n\nThe reservation is optimistic and reads from the inventory ledger. This gate reconciles against the actual bin count, which can differ after damage, shrinkage, or a mis-scan on receipt.\n\nA partial shortfall does not fail the order. Available lines proceed to picking while short lines go to backorder, and the customer is told exactly which items are delayed.\n\n**Owner:** Inventory · **Failure mode:** short lines route to backorder rather than cancelling.\n\n## BACKORDER — Place on Backorder\n\n> Holds unavailable lines and re-attempts reservation when the replenishment shipment lands.\n\nThe customer is notified with a projected availability date drawn from the open purchase order. They can cancel the backordered lines at any point without affecting the lines already shipping.\n\nWhen replenishment is received, the backorder queue is drained oldest-first, and each order re-enters reservation.\n\n**Owner:** Inventory · **Loops back to:** Reserve Inventory\n\n## PICK — Pick and Pack\n\n> Warehouse staff pick each line, verify it by scan, and pack it into a right-sized carton.\n\nEvery unit is scanned at pick and again at pack. The double scan is the single largest driver of the mis-ship rate, so it is never skipped, even for single-line orders.\n\nCartonization picks the smallest box that fits, which reduces both dimensional-weight shipping cost and damage in transit.\n\n**Owner:** Fulfillment · **Target:** same day for orders placed before the cut-off\n\n## SHIP — Hand to Carrier\n\n> The parcel is manifested, labelled, and physically transferred to the carrier.\n\nThe handoff scan is the legal and financial moment of shipment. It is what unlocks payment capture and starts the delivery clock the customer was quoted.\n\nManifest data goes to the carrier before the truck leaves, so tracking is live by the time the customer receives the shipment notification.\n\n**Owner:** Fulfillment · **Emits:** `order.shipped`\n\n## CAPTURE — Capture Payment\n\n> Converts the existing authorization hold into an actual charge for the shipped amount.\n\nCapture is for the shipped amount, not the ordered amount. A split or partial shipment captures only what left the building, and the remaining authorization stays open for the rest.\n\nIf the authorization has expired (holds typically last seven days), capture fails and the payment service re-authorizes silently before retrying.\n\n**Owner:** Payments · **Failure mode:** re-authorize, then retry; escalate after two failures.\n\n## DELIVERED — Delivered\n\n> The carrier confirms delivery and the order reaches its terminal state.\n\nDelivery confirmation closes the order, starts the return window, and releases the record to the analytics warehouse.\n\nPost-delivery events such as returns, refunds, and warranty claims are handled by a separate flow and never reopen this one.\n\n**Owner:** Order management · **Terminal state**\n","product-development-lifecycle.md":"---\ntitle: Product Development Lifecycle\nsubtitle: Business design through architecture governance, delivery, and operations\nstyle: blueprint\npalette: slate\ndirection: LR\ndensity: standard\n---\n\n```mermaid\nflowchart LR\n  subgraph business [Business and Product Design]\n    OPP[Identify Opportunity] --> DISCOVER[Customer Discovery]\n    DISCOVER --> SHAPE[Shape the Solution]\n    SHAPE --> BCASE{Business Case Approved?}\n  end\n\n  subgraph arch [Architecture and Governance]\n    DESIGN[Draft Technical Design] --> REVIEW{Architecture Review}\n    REVIEW --> RISK[Record Risks and Decisions]\n  end\n\n  subgraph sdlc [SDLC]\n    PLAN[Break Into Increments] --> BUILD[Implement]\n    BUILD --> VERIFY{Quality Gate}\n    VERIFY --> RELEASE[Release to Production]\n  end\n\n  subgraph ops [Operations]\n    OPERATE[Operate and Monitor] --> HEALTH{Healthy in Production?}\n    HEALTH --> LEARN[Feed Learnings Back]\n  end\n\n  BCASE -->|Not funded| SHAPE\n  BCASE -->|Funded| DESIGN\n  RISK --> PLAN\n  REVIEW -->|Rejected| SHAPE\n  VERIFY -->|Defects found| BUILD\n  RELEASE --> OPERATE\n  HEALTH -->|Incident| BUILD\n  LEARN --> OPP\n```\n\n## OPP — Identify Opportunity\n\n> A market signal, customer request, or strategic bet enters the funnel as a candidate opportunity.\n\nOpportunities arrive from sales conversations, support ticket clusters, competitive moves, and the operations feedback loop at the far end of this diagram. They are logged in one place regardless of source, so the funnel reflects reality rather than whoever shouted loudest.\n\nEach entry carries a one-line problem statement, the segment affected, and a rough revenue or retention hypothesis. Nothing more, because most opportunities die here and elaborate write-ups are wasted effort.\n\n**Owner:** Product · **Cadence:** reviewed weekly\n\n## DISCOVER — Customer Discovery\n\n> Direct research with real users to confirm the problem exists and is worth solving.\n\nDiscovery is where most opportunities are killed, and that is the point. The bar is evidence from customers who are not already advocates, gathered by someone who is willing to hear a no.\n\n- Five to eight structured interviews with the target segment\n- Review of existing support and churn data for corroboration\n- A written summary of what would have to be true for this to be worth building\n\n**Owner:** Product and Design · **Typical duration:** two to three weeks\n\n## SHAPE — Shape the Solution\n\n> Turns a validated problem into a bounded solution with an explicit scope and appetite.\n\nShaping fixes the time budget first and lets scope flex inside it, rather than fixing scope and letting time flex. The output is a written pitch: the problem, the shape of the solution, deliberately excluded scope, and the known rabbit holes.\n\nThis step is also where rejected architecture reviews and unfunded business cases land. Both are reshaping signals, not failures, and they arrive here with the specific objection attached.\n\n**Owner:** Product and Design · **Receives loop-backs from:** business case, architecture review\n\n## BCASE — Business Case Approved?\n\n> The funding gate: does the projected value justify the appetite and the opportunity cost?\n\nThe case is deliberately coarse. Precision here is false comfort, since the estimates feeding it are themselves rough. What matters is whether this is clearly better than the next-best use of the same team for the same period.\n\n| Input | Source |\n| --- | --- |\n| Expected value | Product, from discovery |\n| Cost of delay | Product and Finance |\n| Rough delivery cost | Engineering |\n\n**Owner:** Product leadership · **Outcome:** funded, or returned to shaping with the specific gap named.\n\n## DESIGN — Draft Technical Design\n\n> Engineering writes the design: components, data flow, interfaces, and the migration path.\n\nThe design document targets a reader who is competent but unfamiliar. It states what is being built, which existing systems it touches, what it deliberately does not do, and which decisions are reversible versus one-way doors.\n\nWhere the change touches a shared interface or a system of record, the design names the affected teams explicitly so review can pull them in.\n\n**Owner:** Engineering · **Reviewed by:** the architecture forum\n\n## REVIEW — Architecture Review\n\n> The governance gate: a standing forum checks the design against the target architecture and standards.\n\nReview is not a rubber stamp and it is not a design competition. It asks a specific set of questions: does this fit the target architecture, does it create a new single point of failure, does it duplicate an existing capability, and is the data handling defensible.\n\nA rejection returns the work to shaping rather than to design, because a design rejected on architectural grounds usually needs its scope reconsidered, not just its diagram redrawn.\n\n**Owner:** Architecture forum · **Loops back to:** Shape the Solution\n\n## RISK — Record Risks and Decisions\n\n> Approved designs record their architecture decisions and accepted risks in the permanent register.\n\nEvery approved design produces decision records naming the choice, the alternatives considered, and the reasoning. Six months later this is the only artifact that explains why the system looks the way it does.\n\nAccepted risks are logged with an owner and a review date. An accepted risk with no owner is an ignored risk.\n\n**Owner:** Architecture forum · **Artifact:** decision records and the risk register\n\n## PLAN — Break Into Increments\n\n> The approved design is decomposed into increments that each ship something usable.\n\nIncrements are sliced so each one can reach production independently. A slice that cannot ship alone is not a slice, it is a phase, and phases hide integration risk until the end.\n\nSequencing puts the riskiest technical unknown first, so a wrong assumption surfaces while there is still budget to respond to it.\n\n**Owner:** Engineering · **Output:** an ordered increment plan\n\n## BUILD — Implement\n\n> Engineers build the increment, with tests written alongside the code rather than after it.\n\nThis step receives two loop-backs: defects found at the quality gate, and production incidents from operations. Both re-enter here because both are resolved by changing code, and routing them through planning again would only add latency.\n\nWork in progress is capped so that finishing beats starting. A team with six things half-done has shipped nothing.\n\n**Owner:** Engineering · **Receives loop-backs from:** quality gate, production health\n\n## VERIFY — Quality Gate\n\n> Automated and exploratory testing decide whether the increment is fit to release.\n\nThe gate is automated wherever the answer is objective: tests, coverage thresholds, security scanning, and performance budgets. Exploratory testing covers what automation cannot, which is whether the thing is actually good.\n\nDefects found here return to implementation with a reproduction, not a description. A defect report without a reproduction is a rumour.\n\n**Owner:** Engineering and QA · **Loops back to:** Implement\n\n## RELEASE — Release to Production\n\n> The increment is deployed behind a flag and rolled out progressively.\n\nRelease and launch are separated. Code reaches production behind a flag, is verified in the real environment, then is exposed to a small percentage of traffic before general availability.\n\nRollback is rehearsed, not theorised. A release path whose rollback has never been executed is a release path with an unknown rollback.\n\n**Owner:** Engineering · **Target:** rollback in under five minutes\n\n## OPERATE — Operate and Monitor\n\n> The team that built it runs it, with alerting tied to user-visible behaviour.\n\nMonitoring watches what users experience, not just what servers report. A healthy CPU graph next to a broken checkout is a monitoring failure.\n\n- Service level objectives with explicit error budgets\n- Alerts that page only for conditions a human must act on now\n- A dashboard that answers \"is it working\" in one screen\n\n**Owner:** The delivery team · **Principle:** you build it, you run it\n\n## HEALTH — Healthy in Production?\n\n> Continuous judgement on whether the change is behaving as designed under real load.\n\nHealth is assessed against the objectives set at design time, not against a general sense of things being fine. Error budget burn, latency at the tail, and the support ticket rate are the three signals that matter most.\n\nAn unhealthy verdict routes straight back to implementation, carrying the incident context with it. This is the longest loop in the diagram and the most important one.\n\n**Owner:** The delivery team · **Loops back to:** Implement\n\n## LEARN — Feed Learnings Back\n\n> What was learned in production becomes the next opportunity, closing the outer loop.\n\nThis is the step organisations skip, and skipping it is why the same mistakes recur. Production reveals things discovery could not: which features go unused, where users get stuck, and which assumptions were wrong.\n\nFindings are written as new opportunities and enter the funnel on equal footing with any other candidate, which keeps the lifecycle a cycle rather than a pipeline.\n\n**Owner:** Product · **Loops back to:** Identify Opportunity\n"};
